<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24"
     height="24"
     role="img"
     aria-labelledby="title desc">
  <title id="title">spool</title>
  <desc id="desc">Three stacked sheets for Plasma launcher icon.</desc>

  <defs>
    <linearGradient id="spool-top-plasma"
                    x1="0.2" y1="6"
                    x2="23.8" y2="11.8"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="35%" stop-color="#FF4F8B"/>
      <stop offset="70%" stop-color="#C44DFF"/>
      <stop offset="100%" stop-color="#6A63FF"/>
    </linearGradient>

    <linearGradient id="spool-dark-plasma"
                    x1="1.3" y1="12"
                    x2="22.7" y2="17.8"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F3640"/>
      <stop offset="100%" stop-color="#1F242C"/>
    </linearGradient>

    <linearGradient id="spool-light-plasma"
                    x1="2.4" y1="18"
                    x2="21.6" y2="18"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D3DCE3"/>
    </linearGradient>
  </defs>

  <!-- bottom: light layer -->
  <path
    d="M2.4 18 L12 12.2 L21.6 18 L12 23.8 Z"
    fill="url(#spool-light-plasma)"/>

  <!-- middle: charcoal core -->
  <path
    d="M1.3 12 L12 6.2 L22.7 12 L12 17.8 Z"
    fill="url(#spool-dark-plasma)"/>

  <!-- top: accent -->
  <path
    d="M0.2 6 L12 0.2 L23.8 6 L12 11.8 Z"
    fill="url(#spool-top-plasma)"/>
</svg>