<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spool</title>
  </head>
  <body>
    <main>
      <section>
        <h2>capture</h2>
        <textarea id="text" placeholder="paste text here"></textarea>
        <button id="save" type="button">Save</button>
        <p id="result"></p>
      </section>
      <section>
        <h2>records</h2>
        <ul id="list"></ul>
        <div id="export-all-row"><button id="export-all" type="button">Export all</button></div>
        <p id="export-result"></p>
        <p id="storage-state"></p>
        <p id="shell-state"></p>
      </section>
      <section id="read" hidden>
        <h2>selected record</h2>
        <div id="read-name"></div>
        <pre id="read-text"></pre>
        <div id="read-actions">
          <button id="copy" type="button" disabled>Copy</button>
          <button id="export-txt" type="button" disabled>Export .txt</button>
          <button id="delete" type="button" disabled>Delete</button>
        </div>
        <p id="read-result"></p>
      </section>
    </main>
    <script type="module" src="/src/main.mobile.ts"></script>
  </body>
</html>
