<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spool</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 1rem; align-items: start; }
      main > section { border: 1px solid #bbb; padding: 0.75rem; min-width: 0; }
      main > section > h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: #555; }
      textarea { width: 100%; min-height: 12rem; box-sizing: border-box; }
      #save { margin-top: 0.5rem; }
      #result { font-family: monospace; white-space: pre-wrap; min-height: 1.2em; }
      #list { list-style: none; margin: 0; padding: 0; max-height: 16rem; overflow-y: auto; }
      #list li button { all: unset; cursor: pointer; display: block; width: 100%; box-sizing: border-box; font-family: monospace; padding: 0.15rem 0.3rem; }
      #list li button:hover { background: #eef2f8; }
      #list li button.selected { background: #d6e4f7; font-weight: 600; }
      #read-name { font-family: monospace; font-size: 0.9rem; margin: 0 0 0.5rem; overflow-wrap: anywhere; font-weight: 600; }
      #read-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-family: monospace; font-size: 0.85rem; max-height: 24rem; overflow-y: auto; background: #fafafa; border: 1px solid #ddd; padding: 0.5rem; }
      #read-actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
      #read-result, #export-result, #storage-state, #shell-state { font-family: monospace; white-space: pre-wrap; min-height: 1.2em; margin: 0.5rem 0 0; }
      #export-all-row { margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>capture</h2>
        <textarea id="text" placeholder="paste text here"></textarea>
        <button id="save" type="button">Save</button>
        <p id="result"></p>
      </section>
      <section>
        <h2>records</h2>
        <ul id="list"></ul>
        <div id="export-all-row"><button id="export-all" type="button">Export all</button></div>
        <p id="export-result"></p>
        <p id="storage-state"></p>
        <p id="shell-state"></p>
      </section>
      <section id="read" hidden>
        <h2>selected record</h2>
        <div id="read-name"></div>
        <pre id="read-text"></pre>
        <div id="read-actions">
          <button id="copy" type="button" disabled>Copy</button>
          <button id="export-txt" type="button" disabled>Export .txt</button>
          <button id="delete" type="button" disabled>Delete</button>
        </div>
        <p id="read-result"></p>
      </section>
    </main>
    <script type="module" src="/src/main.mobile.ts"></script>
  </body>
</html>
