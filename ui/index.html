<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spool</title>
  </head>
  <body data-rail="open">
    <div id="left-rail">
      <div id="rail-head">
        <h1 id="app-title">SPOOL</h1>
        <button id="rail-toggle" type="button" aria-label="Collapse controls">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M10 3L5 8l5 5" />
          </svg>
        </button>
      </div>
      <p id="record-count"></p>
      <p id="storage-state"></p>
      <p id="shell-state"></p>
      <button id="search" type="button">[ SEARCH ]</button>
      <button id="paste-as-new" type="button">[ PASTE AS NEW ]</button>
      <button id="export-all" type="button">[ EXPORT ALL ]</button>
      <p id="export-result"></p>
    </div>
    <main>
      <section id="compose">
        <h2>COMPOSE</h2>
        <div id="composer">
          <textarea id="text" placeholder="type or paste text here"></textarea>
        </div>
        <button id="save" type="button">[ SAVE ]</button>
        <p id="result"></p>
      </section>
      <section id="view">
        <h2>RECORD</h2>
        <p id="empty-state">Select a record to view it here.</p>
        <div id="read" hidden>
          <div id="read-name"></div>
          <pre id="read-text"></pre>
        </div>
        <div id="read-actions">
          <button id="back" type="button">[ BACK TO COMPOSE ]</button>
          <button id="copy" type="button" disabled>[ COPY ]</button>
          <button id="export-txt" type="button" disabled>[ EXPORT ]</button>
          <button id="delete" type="button" disabled>[ DELETE ]</button>
        </div>
        <p id="read-result"></p>
      </section>
    </main>
    <div id="search-overlay" hidden>
      <div id="search-box" role="dialog" aria-label="Search records">
        <div id="search-title">SEARCH RECORDS</div>
        <div id="search-row">
          <input id="search-input" type="text" aria-label="Query records" autocomplete="off" />
          <button id="search-clear" type="button" disabled>[ CLEAR ]</button>
        </div>
        <ul id="search-results"></ul>
        <div id="search-help">
          <span>↑↓ select&#160;&#160;&#160;&#160;Enter open</span>
          <button id="search-close" type="button">[ CLOSE ]</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.mobile.ts"></script>
  </body>
</html>
